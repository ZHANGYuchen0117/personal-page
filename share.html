// assets/js/ai.js
const AI_CONFIG = {
  endpoint: 'https://qnctdjwoylhfbqigqkje.supabase.co/functions/v1/llm-proxy',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3RkandveWxoZmJxaWdxa2plIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzAxODYsImV4cCI6MjEwNTIwNjE4Nn0.j6KMMpwOHU_hwAtL3WNYO7EbVsSwJ5ZhvWa1MhyG1l8',
  timeout: 20000   /* 兜住「一直转圈」：超过这个时间就放弃，让调用方走兜底 */
};

/* 把各种底层报错翻译成访客看得懂的说明。
   浏览器原始报错在 Chrome 是 "Failed to fetch"、Safari 是 "Load failed"，
   直接显示给访客毫无意义。 */
function friendlyAIError(err) {
  if (err && err.name === 'AbortError') return 'AI 响应超时了，请稍后重试';
  const msg = String((err && err.message) || '');
  if (err instanceof TypeError || /load failed|failed to fetch|networkerror|network request failed/i.test(msg)) {
    return '当前网络连不上 AI 服务，换个网络再试试';
  }
  if (/^API \d/.test(msg)) return 'AI 服务暂时不可用，请稍后重试';
  return msg || 'AI 暂时无法响应';
}

function sleep(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

/* 判断是不是「网络层」的偶发失败（Safari 报 Load failed，Chrome 报 Failed to fetch）。
   这类失败重试一次往往就好了；超时（AbortError）不算，重试只会让人多等一倍时间。 */
function isTransientNetworkError(err) {
  if (!err || err.name === 'AbortError') return false;
  const msg = String(err.message || '');
  return (err instanceof TypeError) || /load failed|failed to fetch|network|connection/i.test(msg);
}

async function callLLM(userMessage, onChunk, onDone, onError, _isRetry) {
  const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = controller ? setTimeout(function () { controller.abort(); }, AI_CONFIG.timeout) : null;
  let gotAny = false;   /* 是否已经收到过内容，决定能不能安全重试 */
  try {
    const response = await fetch(AI_CONFIG.endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + AI_CONFIG.anonKey
      },
      body: JSON.stringify({ message: userMessage }),
      signal: controller ? controller.signal : undefined
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error('API ' + response.status + ': ' + errText);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            gotAny = true;
            fullText += delta;
            onChunk(delta);
          }
        } catch (e) {}
      }
    }

    if (onDone) onDone(fullText);
  } catch (err) {
    /* 偶发失败自动重试一次。
       只在「一个字都还没收到」时才重试：如果已经吐了一半，重试会把答案叠成两份。 */
    if (!gotAny && !_isRetry && isTransientNetworkError(err)) {
      console.warn('[ai.js] 首次调用失败，稍后自动重试一次:', err && err.name, err && err.message);
      if (timer) clearTimeout(timer);
      await sleep(900);
      return callLLM(userMessage, onChunk, onDone, onError, true);
    }
    /* 控制台保留原始报错（方便排查），给访客的则是一句人话 */
    console.error('[ai.js] 原始错误:', err && err.name, err && err.message);
    if (onError) onError(friendlyAIError(err));
  } finally {
    if (timer) clearTimeout(timer);
  }
}
</script>
<script>/* ./assets/js/chat.js */
(function () {
  const root = document.getElementById('chat-widget');
  if (!root) return;

  const data = window.PROFILE_DATA || {};
  const intro = data.introMessages || [];
  const menu = data.menuMessage || null;
  const contact = data.contactMessage || null;
  const avatarSrc = data.avatar || '';

  const AVATAR_SVG =
    '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">' +
    '<path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>' +
    '</svg>';

  function buildAvatarHtml(src) {
    const fallback = '<span class="chat__avatar-fallback">' + AVATAR_SVG + '</span>';
    if (!src) return fallback;
    return '<img class="chat__avatar-img" src="' + src + '" alt="" />' + fallback;
  }

  root.innerHTML =
    '<div class="chat">' +
      '<div class="chat__stream" id="chatStream"></div>' +
      '<div class="chat__input-bar">' +
        '<input type="text" class="chat__input" placeholder="问点什么…" aria-label="问点什么" autocomplete="off" />' +
        '<button type="button" class="chat__send">发送</button>' +
      '</div>' +
    '</div>';

  const stream = root.querySelector('#chatStream');
  const input = root.querySelector('.chat__input');
  const sendBtn = root.querySelector('.chat__send');

  /* ---------- V3 无障碍：新消息可被读屏播报 ---------- */
  stream.setAttribute('role', 'log');
  stream.setAttribute('aria-live', 'polite');

  /* ---------- V3 减少动效偏好：不做位移与过场 ---------- */
  function prefersReduced() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /* ---------- V3 进入过场：舞台由虚到实 ---------- */
  let stageIntro = !prefersReduced();
  if (stageIntro) stream.classList.add('is-intro');

  /* ---------- V3 滚动位置记忆 ---------- */
  const SCROLL_KEY = 'chat_scroll';
  let saveTimer = null;

  function saveScroll() {
    try {
      const max = stream.scrollHeight - stream.clientHeight;
      sessionStorage.setItem(SCROLL_KEY, JSON.stringify({
        top: stream.scrollTop,
        atBottom: (max - stream.scrollTop) < 48
      }));
    } catch (e) {}
  }

  /* 开场是自动滚到底部的，这段时间不记录，
     否则会把"在底部"写进记忆，覆盖掉上次要恢复的位置 */
  let introLock = true;
  let userScrolled = false;

  stream.addEventListener('scroll', function () {
    if (introLock) {
      /* 开场期间用户主动滚了也要记住，只是不立刻落盘 */
      userScrolled = true;
      return;
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveScroll, 200);
  });
  window.addEventListener('pagehide', function () {
    if (!introLock || userScrolled) saveScroll();
  });

  stream.addEventListener('error', function (e) {
    const t = e.target;
    if (t && t.classList && t.classList.contains('chat__avatar-img')) {
      t.style.display = 'none';
    }
  }, true);

  /* ---------- 文本安全 & 链接化 ---------- */
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str || '');
    return div.innerHTML;
  }

  // 回答里的 http(s) 链接变成可点链接（先整体转义，再替换，避免注入）
  function linkify(text) {
    return escapeHtml(text).replace(
      /(https?:\/\/[^\s<]*[A-Za-z0-9\/_#+=%&~-])/g,
      function (url) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
      }
    );
  }

  /* ---------- V4 复制文本：优先剪贴板 API，老手机浏览器退回 execCommand ---------- */
  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const done = document.execCommand('copy');
      document.body.removeChild(ta);
      return done;
    } catch (e) {
      return false;
    }
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      /* 注意：writeText 成功时 resolve 的是 undefined，不是 true，
         必须显式归一成布尔值，否则成功也会被判成失败 */
      return navigator.clipboard.writeText(text).then(
        function () { return true; },
        function () { return fallbackCopy(text); }
      );
    }
    return Promise.resolve(fallbackCopy(text));
  }

  /* ---------- V3 纵向错落：每行起始高度四档循环，横向下滑方向由角色决定 ---------- */
  const ENTER_Y = [10, 16, 22, 28];
  let rowSeq = 0;

  function appendRow(modifier, html) {
    const row = document.createElement('div');
    row.className = 'chat__row chat__row--' + modifier;
    row.style.setProperty('--enter-y', ENTER_Y[rowSeq % ENTER_Y.length] + 'px');
    rowSeq += 1;

    const bubble = document.createElement('div');
    bubble.className = 'chat__bubble chat__bubble--' + modifier;
    bubble.innerHTML = html;

    row.appendChild(bubble);
    stream.appendChild(row);

    void row.offsetWidth;
    if (prefersReduced()) {
      row.classList.add('is-static');   /* V3：减少动效偏好下直接呈现 */
    } else {
      row.classList.add('is-entering');
    }

    /* 第一行进来的同时撤掉开场虚化 */
    if (stageIntro) {
      stageIntro = false;
      setTimeout(function () { stream.classList.remove('is-intro'); }, 80);
    }

    stream.scrollTop = stream.scrollHeight;
    return row;
  }

  /* ---------- AI 连不上时的本地兜底 ----------
     数据本来就在页面上（PROFILE_DATA.content），不需要网络。
     按关键词挑最贴近的一段回给访客，答不全但至少不会显示「Load failed」。 */
  function localAnswer(question) {
    const content = (window.PROFILE_DATA && window.PROFILE_DATA.content) || {};
    const q = String(question || '');

    function hit() {
      for (let i = 0; i < arguments.length; i++) {
        if (q.indexOf(arguments[i]) !== -1) return true;
      }
      return false;
    }

    if (hit('专业', '学什么', '学校', '大一', '学院')) {
      const fact = (content.about && content.about.facts || []).filter(function (f) {
        return f.indexOf('专业') !== -1;
      })[0];
      if (fact) return fact + '。';
    }
    if (hit('技能', '会什么', '会些什么', '都会什么', '会啥', '会点啥', '擅长', '拿手', '能力', '技术栈')) {
      return '他的技能包括：' + (content.skills || []).map(function (s) {
        return s.note ? s.name + '（' + s.note + '）' : s.name;
      }).join('、') + '。';
    }
    if (hit('项目', '作品', '做过', '仓库', 'github')) {
      return '他做过的项目：' + (content.projects || []).map(function (p) {
        return p.desc ? p.name + '（' + p.desc + '）' : p.name;
      }).join('；') + '。';
    }
    if (hit('计划', '下一步', '接下来', '规划', '以后')) {
      return '接下来的计划：' + (content.plan || []).map(function (s) {
        return s.version + ' ' + s.theme + '（' + s.items.join('、') + '）';
      }).join('；') + '。';
    }
    if (hit('联系', '微信', '加好友', '怎么找', '私信')) {
      return '可以在上面的「联系我」里扫微信二维码加他。';
    }
    if (content.about && content.about.facts && content.about.facts.length) {
      return content.about.facts.join('，') + '。' + (content.about.stage || '');
    }
    return '';
  }

  /* ---------- AI 回答缓存 ----------
     网络时好时坏时，让「问过的问题」第二次能秒回真答案：
     答成功就存下来，之后 AI 连不上就直接拿上次的答案顶上。
     只存在访客自己浏览器里，最多留 40 条。 */
  const CACHE_KEY = 'ai_cache_v1';
  const CACHE_MAX = 40;

  function cacheGet(question) {
    try {
      const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      const hit = all[question];
      return (hit && hit.a) ? hit.a : '';
    } catch (e) {
      return '';
    }
  }

  function cacheSet(question, answer) {
    if (!question || !answer) return;
    try {
      const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      all[question] = { a: answer, t: Date.now() };
      const keys = Object.keys(all);
      if (keys.length > CACHE_MAX) {
        keys.sort(function (x, y) { return (all[x].t || 0) - (all[y].t || 0); });
        for (let i = 0; i < keys.length - CACHE_MAX; i++) delete all[keys[i]];
      }
      localStorage.setItem(CACHE_KEY, JSON.stringify(all));
    } catch (e) {}
  }

  /* ---------- 统一发送逻辑：菜单点击 / 输入框发送 都走这里 ---------- */
  function sendQuestion(questionText) {
    if (!questionText) return;

    appendRow('ask', questionText);

    /* 菜单按钮的 prompt 已经自带完整资料；自由输入只有原文，
       要在这里补上页面资料，否则 AI 会用它自己那份过期知识作答。 */
    const outgoing = questionText.indexOf('请只依据以下信息') === 0
      ? questionText
      : (typeof data.questionPrompt === 'function' ? data.questionPrompt(questionText) : questionText);

    setTimeout(function () {
      if (typeof callLLM === 'function') {
        const answerRow = appendRow(
          'answer',
          '<span class="chat__thinking"><i></i><i></i><i></i></span>'
        );
        const bubble = answerRow.querySelector('.chat__bubble');
        bubble.classList.add('chat__bubble--ai');

        let started = false;

        callLLM(
          outgoing,
          function (chunk) {
            if (!started) {
              bubble.innerHTML = '';
              started = true;
            }
            bubble.textContent += chunk;
            stream.scrollTop = stream.scrollHeight;
          },
          function (fullText) {
            bubble.innerHTML = linkify(fullText);
            cacheSet(questionText, fullText);   /* 存下来，下次网络不好也能直接用 */
          },
          function (errMsg) {
            /* AI 连不上时别给访客甩报错。
               优先用「上次问过同一问题的答案」（网络不好也能秒回真内容），
               没有缓存就退回页面上现成的资料——两者都不需要网络。 */
            const cached = cacheGet(questionText);
            const local = cached ? '' : localAnswer(questionText);
            bubble.classList.add('chat__bubble--error');

            let html;
            if (cached) {
              html = '<span class="chat__offline">网络不稳，先给你上次问过的答案：</span>' +
                     '<br>' + linkify(cached);
            } else if (local) {
              html = '<span class="chat__offline">AI 暂时连不上（' + errMsg + '），先用本地资料回答：</span>' +
                     '<br>' + linkify(local);
            } else {
              html = escapeHtml('抱歉，' + errMsg);
            }

            /* 一键重试：网络恢复后不用重新打字 */
            html += '<div class="chat__acts">' +
                      '<button type="button" class="chat__retry">重试</button>' +
                    '</div>';
            bubble.innerHTML = html;

            const retryBtn = bubble.querySelector('.chat__retry');
            if (retryBtn) {
              retryBtn.addEventListener('click', function () {
                const row = bubble.closest('.chat__row');
                if (row && row.parentNode) row.parentNode.removeChild(row);
                sendQuestion(questionText);
              });
            }
          }
        );
      } else {
        appendRow('answer', '（AI 未接入，请先配置 ai.js）');
      }
    }, 400);
  }

  /* ---------- 节奏（减少动效偏好下直接全部呈现） ---------- */
  const reducedNow = prefersReduced();
  const START_DELAY = reducedNow ? 0 : 300;
  const STEP = reducedNow ? 0 : 900;
  let timeline = START_DELAY;

  /* ---------- 1~3：头像 + 两条标语 ---------- */
  intro.forEach(function (msg) {
    const t = timeline;
    setTimeout(function () {
      if (msg.type === 'profile') {
        appendRow(
          'profile',
          '<div class="chat__avatar">' + buildAvatarHtml(avatarSrc) + '</div>' +
          '<div class="chat__name">' + (msg.name || data.name || '') + '</div>'
        );
      } else {
        appendRow('answer', msg.text);
      }
    }, t);
    timeline += STEP;
  });

  /* ---------- 4：菜单信息框 ---------- */
  if (menu) {
    const t = timeline;
    setTimeout(function () {
      const buttonsHtml = (menu.options || []).map(function (opt, i) {
        return '<button type="button" class="info-box__btn" data-idx="' + i + '">' + opt.label + '</button>';
      }).join('');

      const row = appendRow(
        'box',
        '<div class="info-box">' +
          '<div class="info-box__title">' + (menu.title || '') + '</div>' +
          '<div class="info-box__list">' + buttonsHtml + '</div>' +
        '</div>'
      );

      row.querySelectorAll('.info-box__btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const idx = parseInt(btn.dataset.idx, 10);
          const opt = menu.options[idx];
          if (!opt) return;
          sendQuestion(opt.prompt || opt.label);
        });
      });
    }, t);
    timeline += STEP;
  }

  /* ---------- 5：联系我信息框（V4：改成微信 / 二维码，不再默认发邮件） ---------- */
  const hasContact = !!(contact && (contact.qr || contact.wechat || contact.email));
  if (hasContact) {
    const t = timeline;
    setTimeout(function () {
      const hasQr = !!contact.qr;
      const hasWechat = !!contact.wechat;

      let inner =
        '<div class="info-box__title">' + escapeHtml(contact.title || '联系我') + '</div>';

      if (hasQr) {
        inner +=
          '<div class="info-box__qr">' +
            '<img class="info-box__qr-img" src="' + escapeHtml(contact.qr) + '" ' +
                 'alt="我的微信二维码" loading="lazy" decoding="async">' +
            (contact.qrTip
              ? '<span class="info-box__qr-tip">' + escapeHtml(contact.qrTip) + '</span>'
              : '') +
          '</div>';
      }

      /* 只在真有按钮时才渲染这一行，避免留一条空的选择条 */
      let actions = '';
      if (hasWechat) {
        actions +=
          '<button type="button" class="info-box__btn info-box__btn--copy" data-copy-wechat>' +
            escapeHtml(contact.label || '复制微信号') +
          '</button>';
      }
      /* 邮箱不再是默认方式，但留了口子：填了才显示 */
      if (contact.email) {
        actions +=
          '<a class="info-box__btn info-box__btn--link" href="mailto:' + escapeHtml(contact.email) + '">' +
            escapeHtml(contact.emailLabel || '发送邮件') +
          '</a>';
      }
      if (actions) inner += '<div class="info-box__list">' + actions + '</div>';

      if (hasWechat) {
        inner += '<p class="info-box__wechat">微信号：<b>' + escapeHtml(contact.wechat) + '</b></p>';
      } else if (contact.tip) {
        inner += '<p class="info-box__wechat">' + escapeHtml(contact.tip) + '</p>';
      }

      const row = appendRow('box', '<div class="info-box">' + inner + '</div>');

      /* 二维码图片没就位就不留破图；如果又没有微信号/邮箱可联系，整条收起 */
      const qrImg = row.querySelector('.info-box__qr-img');
      if (qrImg) {
        qrImg.addEventListener('error', function () {
          const wrap = qrImg.closest('.info-box__qr');
          if (wrap) wrap.hidden = true;
          if (!hasWechat && !contact.email) row.hidden = true;
        });
      }

      /* 复制微信号，点了给个反馈 */
      const copyBtn = row.querySelector('[data-copy-wechat]');
      if (copyBtn && hasWechat) {
        const original = copyBtn.textContent;
        copyBtn.addEventListener('click', function () {
          copyText(contact.wechat).then(function (ok) {
            copyBtn.textContent = ok ? '已复制 ✓' : '复制失败，请长按微信号';
            copyBtn.classList.toggle('is-copied', !!ok);
            setTimeout(function () {
              copyBtn.textContent = original;
              copyBtn.classList.remove('is-copied');
            }, 1600);
          });
        });
      }
    }, t);
    timeline += STEP;
  }

  /* ---------- V3 滚动位置记忆：开场结束后恢复上次位置 ---------- */
  setTimeout(function () {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(SCROLL_KEY) || 'null'); } catch (e) {}

    /* top 为 0 也是有效位置（当时停在最上面），只按"是否在底部"判断 */
    if (saved && !saved.atBottom && stream.scrollHeight > stream.clientHeight) {
      stream.scrollTop = saved.top;
      /* 记忆位置已失效（内容比当时短）就退回底部 */
      if (Math.abs(stream.scrollTop - saved.top) > 12) stream.scrollTop = stream.scrollHeight;
    } else {
      stream.scrollTop = stream.scrollHeight;
    }

    /* 恢复完成：之后才把用户的滚动当作"要记住的位置" */
    introLock = false;
    stream.setAttribute('data-scroll-ready', '1');
  }, timeline + (reducedNow ? 120 : 1200));

  /* ---------- 输入框：点发送 或 按回车 ---------- */
  function handleSend() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    sendQuestion(q);
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSend();
    }
  });
})();
</script>
<script>/* ./assets/js/app.js */
(function () {
  const data = window.PROFILE_DATA || {};

  /* ---------- 主题切换 ---------- */
  function syncThemeColor(theme) {
    const meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#141413' : '#f4f3f1');
  }

  const themeBtn = document.querySelector('[data-toggle-theme]');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      syncThemeColor(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  }

  /* ---------- 姓名 / 标语（如果页面其他位置也用到） ---------- */
  document.querySelectorAll('[data-profile="name"]').forEach(function (el) {
    el.textContent = data.name || el.textContent;
  });

  /* ---------- 修改日志弹窗 ---------- */
  const modal = document.getElementById('changelogModal');
  const sub = document.getElementById('changelogSub');
  const body = document.getElementById('changelogBody');
  const openBtn = document.querySelector('[data-open-changelog]');

  function renderChangelog() {
    const log = data.changelog || {};

    sub.textContent = '创建于 ' + (log.date || '') + ' · 当前版本：' + (log.version || '');

    body.innerHTML = (log.groups || []).map(function (group) {
      const items = (group.items || []).map(function (item) {
        return '<li class="' + (item.done ? 'is-done' : 'is-todo') + '">' + item.text + '</li>';
      }).join('');

      return (
        '<section class="log-entry">' +
          '<h3 class="log-entry__title">' + group.title + '</h3>' +
          '<ul class="log-entry__list">' + items + '</ul>' +
        '</section>'
      );
    }).join('');
  }

  function openModal() {
    if (!modal) return;
    renderChangelog();
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    if (!modal) return;
    modal.hidden = true;
    document.body.style.overflow = '';
  }

  if (openBtn) openBtn.addEventListener('click', openModal);

  if (modal) {
    modal.querySelectorAll('[data-close-modal]').forEach(function (el) {
      el.addEventListener('click', closeModal);
    });
  }

  /* ---------- V3 键盘操作：Esc 关闭任意弹窗 + Tab 焦点循环 ---------- */
  /* 顺序 = 叠放顺序，最后一个是「最上层」，Esc 优先关它。
     V5：补上公告栏；注册弹窗的真实 id 是 registerModal（原来写的
     communityRegisterModal 根本取不到元素，导致注册弹窗按 Esc 关不掉） */
  const MODALS = ['communityModal', 'feedbackModal', 'changelogModal', 'announcementModal', 'registerModal'];

  function visibleModals() {
    return MODALS.map(function (id) { return document.getElementById(id); })
      .filter(function (m) { return m && !m.hidden; });
  }

  document.addEventListener('keydown', function (e) {
    const open = visibleModals();
    if (!open.length) return;
    const top = open[open.length - 1];

    if (e.key === 'Escape') {
      const closeBtn = top.querySelector('.modal__close');
      if (closeBtn) closeBtn.click();
      return;
    }

    if (e.key === 'Tab') {
      const panel = top.querySelector('.modal__panel') || top;
      const all = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      const list = Array.prototype.filter.call(all, function (el) {
        return !el.disabled && el.offsetParent !== null;
      });
      if (!list.length) return;

      const first = list[0];
      const last = list[list.length - 1];
      const active = document.activeElement;

      if (!panel.contains(active)) {
        e.preventDefault();
        first.focus();
      } else if (e.shiftKey && active === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && active === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  /* ---------- V3 焦点管理：打开时移入弹窗，关闭后还给触发按钮 ---------- */
  const triggers = {};

  /* 记录最后一次点击的可聚焦元素：脚本触发打开时也能正确回焦 */
  let lastClicked = null;
  document.addEventListener('click', function (e) {
    const el = e.target && e.target.closest ? e.target.closest('button, [href], [tabindex]') : null;
    if (el) lastClicked = el;
  }, true);

  MODALS.forEach(function (id) {
    const m = document.getElementById(id);
    if (!m) return;

    new MutationObserver(function () {
      if (!m.hidden) {
        const active = document.activeElement;
        const trigger =
          (active && active !== document.body && !m.contains(active)) ? active : lastClicked;
        if (trigger && !m.contains(trigger)) triggers[id] = trigger;

        const panel = m.querySelector('.modal__panel') || m;
        if (!panel.hasAttribute('tabindex')) panel.setAttribute('tabindex', '-1');
        panel.focus();
      } else {
        const t = triggers[id];
        if (t && document.contains(t) && t.offsetParent !== null) {
          t.focus();
          delete triggers[id];
        }
      }
    }).observe(m, { attributes: true, attributeFilter: ['hidden'] });
  });

  /* ---------- V3 键盘避让：手机键盘弹出时给页面留出空间 ---------- */
  (function keyboardAvoid() {
    const vv = window.visualViewport;
    if (!vv) return;

    function update() {
      const gap = window.innerHeight - vv.height - vv.offsetTop;
      const kb = gap > 60 ? Math.round(gap) : 0;
      document.documentElement.style.setProperty('--kb-offset', kb + 'px');

      /* 键盘弹出时如果对话区本来就在底部，保持最新消息可见 */
      if (kb > 0) {
        const stream = document.getElementById('chatStream');
        if (!stream) return;
        const max = stream.scrollHeight - stream.clientHeight;
        if ((max - stream.scrollTop) < 80) {
          setTimeout(function () { stream.scrollTop = stream.scrollHeight; }, 30);
        }
      }
    }

    vv.addEventListener('resize', update);
    vv.addEventListener('scroll', update);
    update();
  })();
})();
</script>
<script>/* ./assets/js/gestures.js */
/* ==========================================================
 * V3 手势：触屏下从面板顶部下拉关闭弹窗
 * - 只在面板顶部 72px 内、且面板已滚到顶时接管，避免抢正常滚动
 * - 下拉超过 80px 松手即关闭；不够则回弹
 * - 关闭动作复用弹窗自己的关闭按钮，不另开一套逻辑
 * ========================================================== */
(function () {
  const TOP_ZONE = 72;      // 顶部可拖拽区域高度
  const THRESHOLD = 80;     // 触发关闭的下拉距离

  document.querySelectorAll('.modal__panel').forEach(function (panel) {
    const modal = panel.closest('.modal');
    if (!modal) return;

    let startY = null;
    let startX = 0;
    let dy = 0;
    let dragging = false;

    panel.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { startY = null; return; }
      const t = e.touches[0];
      const rect = panel.getBoundingClientRect();
      if (t.clientY - rect.top > TOP_ZONE) { startY = null; return; }
      if (panel.scrollTop > 4) { startY = null; return; }
      startY = t.clientY;
      startX = t.clientX;
      dy = 0;
      dragging = false;
    }, { passive: true });

    panel.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      const t = e.touches[0];
      const moveY = t.clientY - startY;
      const moveX = Math.abs(t.clientX - startX);

      if (!dragging) {
        /* 纵向意图明确才接管，横向滑动不拦 */
        if (moveY < 8 || moveX > Math.abs(moveY)) return;
        if (panel.scrollTop > 0) { startY = null; return; }
        dragging = true;
        panel.style.transition = 'none';
      }

      dy = Math.max(0, moveY);
      panel.style.transform = 'translateY(' + (dy * 0.55) + 'px)';
      panel.style.opacity = String(Math.max(0.55, 1 - dy / 420));
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    function settle(allowClose) {
      if (startY === null) return;
      const pulled = dy;
      startY = null;
      if (!dragging) return;
      dragging = false;

      panel.style.transition = 'transform .28s cubic-bezier(.16, 1, .3, 1), opacity .28s ease';

      if (allowClose && pulled > THRESHOLD) {
        panel.style.transform = 'translateY(120%)';
        panel.style.opacity = '0';
        setTimeout(function () {
          const btn = modal.querySelector('.modal__close');
          if (btn) btn.click();
          /* 复位，下次打开还是正常样子 */
          panel.style.transition = '';
          panel.style.transform = '';
          panel.style.opacity = '';
        }, 190);
      } else {
        panel.style.transform = '';
        panel.style.opacity = '';
        setTimeout(function () { panel.style.transition = ''; }, 300);
      }
    }

    panel.addEventListener('touchend', function () { settle(true); });
    panel.addEventListener('touchcancel', function () { settle(false); });
  });
})();

</script>
<script>/* ./assets/js/visits.js */
/* ==========================================================
 * V4 访问统计：每次会话匿名记一条访问（不记 IP、不记个人信息）
 *
 * - 一个浏览器会话只记一次（sessionStorage 打标）
 * - 只上报：路径 / 来源域名 / 语言 / 屏幕尺寸 / 随机访客号
 * - 表还没建、策略不允许、断网：全部静默失败，绝不影响页面
 * - 后台查看：Supabase 控制台里看 visits 表（前端不给读权限）
 *
 * 建表 SQL 见仓库 outputs/v4-supabase-setup.sql
 * ========================================================== */
(function () {
  const cfg = window.SUPABASE_CONFIG || {};

  function visitorId() {
    let id = null;
    try { id = localStorage.getItem('visit_sid'); } catch (e) {}
    if (!id) {
      id = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem('visit_sid', id); } catch (e) {}
    }
    return id;
  }

  function buildPayload() {
    let ref = '';
    try {
      if (document.referrer) {
        ref = new URL(document.referrer).hostname || '';
      }
    } catch (e) {}
    return {
      path: location.pathname + (location.hash || ''),
      referrer: ref || null,
      lang: navigator.language || null,
      screen: (window.screen && screen.width) ? (screen.width + 'x' + screen.height) : null,
      session_id: visitorId()
    };
  }

  /* 暴露出来便于自测与手动补发 */
  function sendVisitPing(payload) {
    const body = payload || buildPayload();
    window.__lastVisitPing = body;
    window.__visitPingState = 'sending';
    if (!cfg.url || !cfg.anonKey) {
      window.__visitPingState = 'no-config';
      return Promise.resolve(false);
    }
    try {
      return fetch(cfg.url.replace(/\/$/, '') + '/rest/v1/visits', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': cfg.anonKey,
          'Authorization': 'Bearer ' + cfg.anonKey,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(body),
        keepalive: true
      }).then(function (res) {
        window.__visitPingState = res && res.ok ? 'sent' : 'failed';
        // 页面上继续静默（访客不该被后台配置问题打扰），但控制台要说清楚原因，
        // 否则「表没建」这种问题会一直悄无声息。
        if (res && !res.ok) {
          if (res.status === 404) {
            console.warn('[visits] visits 表不存在，访问统计没有生效。请先在 Supabase 执行 supabase/v4-security.sql');
          } else {
            console.warn('[visits] 访问统计上报失败，HTTP ' + res.status);
          }
        }
        return !!(res && res.ok);
      }).catch(function () {
        window.__visitPingState = 'failed';
        return false;
      });
    } catch (e) {
      window.__visitPingState = 'failed';
      return Promise.resolve(false);
    }
  }

  window.sendVisitPing = sendVisitPing;

  /* 一个会话只记一次 */
  try {
    if (sessionStorage.getItem('visit_pinged') === '1') {
      window.__visitPingState = 'skipped';   /* 这个会话已经记过，不重复记 */
      return;
    }
    sessionStorage.setItem('visit_pinged', '1');
  } catch (e) {}

  sendVisitPing();
})();
</script>

</body>
</html>
